---
layout: default
title: My Turbines
---

<!-- Page header -->
<header class="py-4 border-bottom">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h1 class="h4 mb-1">My Turbines</h1>
      <p class="text-muted mb-0">Turbines linked to your account</p>
    </div>
    <div>
      <!-- Optional manual refresh -->
      <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
    </div>
  </div>
</header>

<main class="py-4">
  <div class="container">
    <!-- Status / messages -->
    <div id="statusArea" class="mb-3">
      <div id="statusLoading" class="d-flex align-items-center gap-2">
        <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
        <span>Loading your turbines…</span>
      </div>
      <div id="statusMsg" class="d-none"></div>
    </div>

    <!-- User summary -->
    <div id="userCard" class="card mb-4 d-none">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <div class="text-muted small">Signed in as</div>
          <div id="userEmail" class="fw-semibold"></div>
        </div>
        <div class="text-end">
          <div class="text-muted small">Total turbines</div>
          <div id="turbineCount" class="fw-semibold">0</div>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="resultsWrap" class="card d-none">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th scope="col" style="width: 80px;">#</th>
                <th scope="col">Turbine ID</th>
              </tr>
            </thead>
            <tbody id="resultsTbody">
              <!-- rows injected -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center text-muted py-5 d-none">
      <p class="mb-1">No turbines are currently associated with your account.</p>
      <p class="mb-0 small">If you think this is a mistake, please contact support.</p>
    </div>
  </div>
</main>

<script type="module">
  // Reuse the Cognito/auth bridge provided by your Jekyll nav include.
  // Assumes window.authReady and window.currentUser are available.

  const LAMBDA_URL = "https://dkl7y2mmircsyadeemm4hmm6wa0ffzsz.lambda-url.us-east-1.on.aws/";

  // Elements
  const statusLoading = document.getElementById("statusLoading");
  const statusMsg     = document.getElementById("statusMsg");
  const userCard      = document.getElementById("userCard");
  const userEmailEl   = document.getElementById("userEmail");
  const turbineCount  = document.getElementById("turbineCount");
  const resultsWrap   = document.getElementById("resultsWrap");
  const resultsTbody  = document.getElementById("resultsTbody");
  const emptyState    = document.getElementById("emptyState");
  const refreshBtn    = document.getElementById("refreshBtn");

  function showLoading(show) {
    statusLoading.classList.toggle("d-none", !show);
  }

  function showStatus(message, type = "info") {
    // type: 'info' | 'success' | 'warning' | 'danger'
    statusMsg.className = ""; // reset
    statusMsg.classList.add(`alert`, `alert-${type}`);
    statusMsg.textContent = message;
    statusMsg.classList.remove("d-none");
  }

  function clearStatus() {
    statusMsg.className = "d-none";
    statusMsg.textContent = "";
  }

  function parseItemsPayload(data) {
    // Support either:
    // 1) { items: [...] }
    // 2) { body: "{\"items\":[...]}" }
    if (Array.isArray(data?.items)) return data.items;

    if (typeof data?.body === "string") {
      try {
        const inner = JSON.parse(data.body);
        if (Array.isArray(inner?.items)) return inner.items;
      } catch {
        /* swallow */
      }
    }
    return [];
  }

  function renderRows(ids) {
    resultsTbody.innerHTML = "";
    ids.forEach((id, idx) => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.scope = "row";
      th.textContent = String(idx + 1);

      const tdId = document.createElement("td");
      tdId.innerHTML = `<code>${String(id)}</code>`;

      tr.appendChild(th);
      tr.appendChild(tdId);
      resultsTbody.appendChild(tr);
    });
  }

  async function fetchTurbinesByEmail(email) {
    const url = new URL(LAMBDA_URL);
    url.searchParams.set("email", email);
    const res = await fetch(url.toString(), {
      method: "GET",
      mode: "cors",
      headers: { "Accept": "application/json" }
    });

    // If your Lambda URL returns the APIGW-style wrapper,
    // res.ok is still true; we’ll parse and unwrap inside.
    const data = await res.json().catch(() => ({}));
    return parseItemsPayload(data);
  }

  async function load() {
    clearStatus();
    showLoading(true);
    userCard.classList.add("d-none");
    resultsWrap.classList.add("d-none");
    emptyState.classList.add("d-none");

    // Wait for auth info the nav include exposes
    try { if (window.authReady) await window.authReady; } catch {}

    const email = window.currentUser?.email || window.currentUser?.profile?.email || null;

    if (!email) {
      showLoading(false);
      showStatus("You must be signed in to view your turbines.", "warning");
      return;
    }

    userEmailEl.textContent = email;
    userCard.classList.remove("d-none");

    try {
      const items = await fetchTurbinesByEmail(email);
      const unique = [...new Set(items.map(String))];

      turbineCount.textContent = unique.length;

      if (unique.length === 0) {
        emptyState.classList.remove("d-none");
        resultsWrap.classList.add("d-none");
      } else {
        renderRows(unique);
        resultsWrap.classList.remove("d-none");
        emptyState.classList.add("d-none");
      }
    } catch (e) {
      console.error("Fetch error:", e);
      showStatus("Failed to load turbines. Please try again.", "danger");
    } finally {
      showLoading(false);
    }
  }

  refreshBtn?.addEventListener("click", load);

  // Auto-load on first paint
  window.addEventListener("DOMContentLoaded", load);
</script>
